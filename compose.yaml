# USER-EDITABLE: select components, ports, environment, and persistent storage.
# Component build/startup details belong under components/.
# Keep the project name stable so existing cade-minimal named volumes are reused.
name: cade-minimal

services:
  workbench:
    extends:
      file: ./components/workbench/service.yaml
      service: workbench
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?Set NODE_RED_CREDENTIAL_SECRET in .env}
      # Flow definitions: "bundled" (Git-tracked in this repo), "git" (remote),
      # or "host" (opt-in overlay). No host checkout needed for Git mode.
      NODE_RED_FLOWS_SOURCE: ${NODE_RED_FLOWS_SOURCE:-bundled}
      NODE_RED_GIT_URL: ${NODE_RED_GIT_URL:-}
      NODE_RED_GIT_REF: ${NODE_RED_GIT_REF:-main}
      NODE_RED_FLOW_PATH: ${NODE_RED_FLOW_PATH:-flows.json}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
      - "127.0.0.1:${NODE_RED_PORT:-1880}:1880"
    volumes:
      - ./workspace:/workspace
      - home:/home/node
      # Persistent credential/context state, independent of Git definitions.
      # Override with ./state/node-red to use a host directory instead.
      - ${NODE_RED_STATE_STORAGE:-node_red_state}:/home/node/.node-red
      - ./config/srt-settings.json:/etc/srt-settings.json:ro

  redis:
    extends:
      file: ./components/redis/service.yaml
      service: redis
    profiles: [redis]
    volumes:
      - redis_data:/data

volumes:
  home:
  node_red_state:
  redis_data:
