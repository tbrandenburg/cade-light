name: cade-minimal

services:
  workbench:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
              curl git ca-certificates python3 python3-venv bubblewrap socat ripgrep \
            && rm -rf /var/lib/apt/lists/*
        RUN python3 -m venv /opt/jupyter \
            && /opt/jupyter/bin/pip install --no-cache-dir jupyterlab==4.4.5
        ENV PATH="/opt/jupyter/bin:$${PATH}"
        RUN npm install -g --no-audit --no-fund \
              node-red@4.1.0 \
              @flowfuse/node-red-dashboard@1.31.0 \
              @tbrandenburg/node-red-agents@0.3.8 \
              opencode-ai@1.18.25 \
              @anthropic-ai/sandbox-runtime@0.0.75
        RUN curl -fsSL https://code-server.dev/install.sh \
            | sh -s -- --method=standalone --prefix=/usr/local
        COPY scripts/node-red-settings.js /etc/node-red/settings.js
        COPY --chmod=755 scripts/start.sh /usr/local/bin/start-workbench
        RUN mkdir -p /workspace /home/node/.node-red \
            && chown -R node:node /workspace /home/node
        USER node
        WORKDIR /workspace
        CMD ["/usr/local/bin/start-workbench"]
    init: true
    restart: unless-stopped
    environment:
      PASSWORD: ${PASSWORD:?required}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?required}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET:?required}
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
      - "127.0.0.1:${NODE_RED_PORT:-1880}:1880"
    volumes:
      - ./workspace:/workspace
      - home:/home/node
      - ./scripts/srt-settings.json:/etc/srt-settings.json:ro
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  home:
  redis_data:
